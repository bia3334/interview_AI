name: Release (After-Merge)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit release version (e.g. 1.0.2). Leave blank to auto-calculate.'
        required: false
        default: ''
        type: string
      bump_type:
        description: 'Semantic bump type if auto-calculating'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      draft:
        description: 'Publish as draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Publish as pre-release'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Version & Release Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_name: ${{ steps.version.outputs.release_name }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Fetch all history and tags

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine Release Version
        id: version
        run: node scripts/prepare-release.js
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version || '' }}
          BUMP_TYPE: ${{ github.event.inputs.bump_type || '' }}

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            build_cmd: npm run build
            artifact_name: release-windows
            artifact_path: |
              release/*.exe
              release/*.blockmap
          - os: macos-latest
            platform: macOS
            build_cmd: npm run build:mac
            artifact_name: release-macos
            artifact_path: |
              release/*.dmg
              release/*.blockmap
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # package-lock.json is gitignored in this repository, so use npm install
        run: npm install

      - name: Set package version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build installer package (${{ matrix.platform }})
        run: ${{ matrix.build_cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release

      - name: List artifacts to be released
        run: ls -la dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          files: |
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.blockmap
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
