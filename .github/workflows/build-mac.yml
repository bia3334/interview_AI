name: Build macOS app

# Builds an unsigned .dmg on GitHub's cloud macOS runners.
# Run it manually from the Actions tab (workflow_dispatch), or push a
# version tag like `v1.0.1` to also publish the .dmg to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS .dmg (x64 + arm64, unsigned)
        run: npm run build:mac
        env:
          # No Apple Developer certificate -> ad-hoc sign only, skip notarization.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload .dmg as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenGenius-macOS
          path: release/*.dmg
          if-no-files-found: error

      - name: Attach .dmg to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
