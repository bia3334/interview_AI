<div class="shortcuts-container">
  <div class="shortcuts-header">
    <p class="shortcuts-hint">
      Click <strong>Rebind</strong>, then press the new key combination. Each
      shortcut needs a modifier (Ctrl/Cmd, Shift or Alt). Press
      <span class="key">Esc</span> to cancel.
    </p>
    <button class="btn btn-small" (click)="resetAll()">Reset all to defaults</button>
  </div>

  <div class="shortcut-item" *ngFor="let s of shortcuts">
    <span class="shortcut-action">{{ s.label }}</span>

    <div class="shortcut-controls">
      <div class="shortcut-key" *ngIf="capturingId !== s.id">
        <span *ngFor="let key of keysFor(s.accelerator); let last = last" class="key">
          {{ key }}<span *ngIf="!last" class="plus">+</span>
        </span>
      </div>

      <div class="shortcut-key capturing" *ngIf="capturingId === s.id">
        <span class="capture-prompt">Press keys…</span>
      </div>

      <button
        class="btn btn-small"
        *ngIf="capturingId !== s.id"
        (click)="startCapture(s.id)">
        Rebind
      </button>
      <button
        class="btn btn-small"
        *ngIf="capturingId === s.id"
        (click)="cancelCapture()">
        Cancel
      </button>

      <button
        class="btn btn-small btn-ghost"
        *ngIf="isCustom(s) && capturingId !== s.id"
        (click)="resetOne(s)"
        title="Reset to default">
        Reset
      </button>
    </div>
  </div>
</div>
