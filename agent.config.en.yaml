version: "1.0"
project: "Electron AI Assistant"
language: "en"

# Invariants (agents must NOT break these)
invariants:
  preserve_public_api: true
  public_api_source: "src/preload/types.d.ts"   # window.electronAPI.* is the public surface
  allow_new_api_with_backcompat: true
  forbid_removal_of_existing_api: true
  sanitize_markdown_required: true
  no_eval_or_remote_code: true
  csp_required: true

# Change constraints
constraints:
  allowed_dependencies:
    - marked
    - highlight.js
    - electron-store
  banned_dependencies:
    - lodash-es        # avoid heavy libs unless necessary
  file_globs_protected:
    - "src/preload/types.d.ts"
    - "index.html"
    - "styles/**"
  require_update_docs_when_api_changes: true

# Output behavior all agents must follow
output_contract:
  require_path_header_in_code_blocks: true       # // path: <...>
  full_file_content_only: true                   # no fragmented diffs, no pseudo-code
  include_migration_notes_on_api_change: true
  update_docs:
    - "AGENT_GUIDE_EN.md"
    - "agent.config.en.yaml"
    - "docs/adr/*"  # when architecture decisions change

# Quality & security
quality_gates:
  lint_command: "npm run lint"
  build_command: "npm run build"
  test_command: "npm test"
  min_test_success_ratio: 0.9
  forbid_security_issues:
    - "no-sanitize-markdown"
    - "uses-eval"
    - "unsafe-inline-scripts"

# UX rules
ux_rules:
  drag_region_only_in_header: true
  allow_text_selection_in_content: true
  avoid_shortcuts_when_input_focused: true

# Paths agents should prioritize reading
priority_paths:
  # Always read the agent guide first
  - "AGENT_GUIDE_EN.md"
  - "agent.config.en.yaml"
  - "src/main/**"
  - "src/preload/**"
  - "src/renderer/**"
  - "styles/**"
  - "index.html"

# Roadmap hints
roadmap_hints:
  - "Adapterize models.ts to plug different LLMs easily"
  - "Extract i18n resources for UI"
  - "Introduce theming via CSS variables"
